<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow</title><link rel="stylesheet" href="style.css"></head><body><main><header><small>PRODUCTIVITY / WORKSPACE</small><h1>TaskFlow<span>.</span></h1><p>Make today count. Organize your tasks in one place.</p></header><section><form id="form"><label for="task">New task</label><div class="input"><input id="task" maxlength="100" required placeholder="What needs to be done?"><button>Add task</button></div><p id="error" role="alert"></p></form><div class="toolbar"><strong id="count"></strong><select id="filter" aria-label="Filter tasks"><option value="all">All tasks</option><option value="active">Active</option><option value="done">Completed</option></select></div><ul id="list"></ul><p id="empty">Nothing here yet. Add a task to get started.</p></section><footer>TaskFlow · Evidence 4</footer></main><script type="module" src="app.mjs"></script></body></html>
